name: Build and Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      release_version: ${{ steps.check.outputs.release_version }}
      official_sha: ${{ steps.check.outputs.official_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check official repository
        id: check
        run: |
          rm -rf /tmp/official
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/official
          OFFICIAL_SHA=$(git -C /tmp/official rev-parse HEAD)
          VERSION=$(node -p "require('/tmp/official/package.json').version")
          RELEASE_VERSION=$(node -e "const v=process.argv[1]; const r=process.argv[2]; if(v.includes('-')){console.log(v+'.'+r)}else{const p=v.split('.'); p[2]=String(Number(p[2]||0)+1); console.log(p.join('.'))}" "$VERSION" "$GITHUB_RUN_NUMBER")
          echo "official_sha=$OFFICIAL_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [ -f LAST_BUILT_SHA ] && [ "$(cat LAST_BUILT_SHA)" = "$OFFICIAL_SHA" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Official SHA: $OFFICIAL_SHA"
          echo "Official version: $VERSION"
          echo "Release version: $RELEASE_VERSION"
          echo "Should build: ${{ steps.check.outputs.should_build }}"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable
            platform: windows
          - os: macos-latest
            args: --mac dmg zip
            platform: macos
          - os: ubuntu-latest
            args: --linux AppImage deb
            platform: linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Prepare official source with overlay
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git source
          node scripts/prepare-source.mjs source "${{ needs.check.outputs.release_version }}"

      - name: Install dependencies
        working-directory: source
        run: pnpm install --no-frozen-lockfile

      - name: Build desktop TypeScript
        working-directory: source
        run: pnpm --filter dsh-desktop-live build

      - name: Package and publish (${{ matrix.platform }})
        working-directory: source/apps/desktop
        run: npx electron-builder ${{ matrix.args }} --publish always

  finish:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark official SHA as built
        run: |
          echo "${{ needs.check.outputs.official_sha }}" > LAST_BUILT_SHA
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LAST_BUILT_SHA
          git commit -m "chore: mark official SHA ${{ needs.check.outputs.official_sha }} as built" || echo "No changes to commit"
          git push

  notify:
    needs: [check, build]
    if: always() && (needs.check.result == 'failure' || (needs.check.outputs.should_build == 'true' && needs.build.result != 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SHOULD_BUILD: ${{ needs.check.outputs.should_build }}
          RELEASE_VERSION: ${{ needs.check.outputs.release_version }}
          OFFICIAL_SHA: ${{ needs.check.outputs.official_sha }}
        with:
          script: |
            const checkResult = process.env.CHECK_RESULT
            const buildResult = process.env.BUILD_RESULT
            const shouldBuild = process.env.SHOULD_BUILD
            const releaseVersion = process.env.RELEASE_VERSION
            const officialSha = process.env.OFFICIAL_SHA

            let status
            if (checkResult === 'failure') {
              status = 'check failed'
            } else if (buildResult === 'failure') {
              status = 'build failed'
            } else {
              status = 'build succeeded'
            }

            const title = 'Automated Build Notifications'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `Status: **${status}**`,
              `Official SHA: \`${officialSha || 'unknown'}\``,
              `Release version: ${releaseVersion || 'unknown'}`,
              `Should build: ${shouldBuild || 'unknown'}`,
              `Run: ${runUrl}`,
            ].join('\n')

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })
            const issue = issues.find((item) => item.title === title)

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
            }
